[workspace]
resolver = "2"
members = [
    "crates/cyclone_engine",
    "crates/cyclone_render",
    "crates/cyclone_worldgen",
    "crates/cyclone_ui",
    "crates/cyclone_game",
    "crates/cyclone",
    "tools/worldgen-cli",
    "tools/islsize", "tools/whichisl",
]
# The macroquad V1 build is archived here; it is not part of the V2 workspace.
exclude = ["v1"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Cyclone Rescue — rescue-helicopter archipelago game"

# One Bevy version for every crate. Pinned exactly per spec 00; upgrades are
# their own commit with a note in DECISIONS.md.
#
# default-features = false because Bevy's defaults drag in bevy_audio (cpal ->
# alsa-sys) and bevy_gilrs (libudev-sys), which need *-dev pkg-config packages
# this dev box does not have. Audio arrives with spec 05 (spec 01 explicitly
# allows silent placeholders); gamepad bindings come back the same way. See
# DECISIONS.md.
[workspace.dependencies.bevy]
version = "=0.20.1"
default-features = false
features = [
    # app plumbing (bevy's `default_app` minus reflect_auto_register magic)
    "async_executor", "bevy_asset", "bevy_log", "bevy_state",
    "std", "multi_threaded",
    # windowing — x11 only: winit's x11 backend (x11rb) is pure Rust with no
    # system build deps, while the wayland backend needs wayland-sys .pc files
    # this host lacks. Wayland works through XWayland. See DECISIONS.md.
    "bevy_winit", "x11", "custom_cursor", "bevy_clipboard",
    # shared 3D + UI APIs (`common_api`)
    "bevy_animation", "bevy_camera", "bevy_color", "bevy_curve", "bevy_gizmos",
    "bevy_image", "bevy_mesh", "bevy_shader", "bevy_material", "bevy_text",
    "bevy_window", "hdr", "png",
    # 3D render stack (`3d_bevy_render`)
    "bevy_render", "bevy_core_pipeline", "bevy_anti_alias", "bevy_gltf",
    "bevy_pbr", "bevy_post_process", "bevy_gizmos_render", "bevy_light",
    "bevy_mikktspace", "ktx2", "morph", "morph_animation", "gltf_animation",
    "smaa_luts", "tonemapping_luts", "zstd_rust",
    # UI stack (`ui_bevy_render`)
    "bevy_input_focus", "bevy_ui", "bevy_ui_render", "bevy_ui_widgets",
    # sprites (needed by sprite picking; cheap)
    "bevy_sprite", "bevy_sprite_render",
    # scenes + picking
    "bevy_scene", "bevy_world_serialization", "bevy_picking", "mesh_picking",
    "sprite_picking", "ui_picking",
]

[workspace.dependencies]
cyclone_engine = { path = "crates/cyclone_engine" }
cyclone_render = { path = "crates/cyclone_render" }
cyclone_worldgen = { path = "crates/cyclone_worldgen" }
cyclone_ui = { path = "crates/cyclone_ui" }
cyclone_game = { path = "crates/cyclone_game" }

serde = { version = "1", features = ["derive"] }
ron = "0.10"
rand = "0.9"
rand_chacha = "0.9"
libm = "0.2"
thiserror = "2"
getrandom = "0.3"
directories = "6"
clap = { version = "4", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png"] }
rayon = "1"
blake3 = "1"
anyhow = "1"
smol_str = "0.2"
criterion = "0.7"
imageproc = "0.26"
ab_glyph = "0.2"
proptest = "1"

[profile.dev]
opt-level = 1
# Keep debug info lean: full debuginfo for Bevy eats gigabytes of disk and we
# have 12 GB free. Line tables keep usable backtraces.
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3        # optimise Bevy and deps even in dev; our code stays fast to compile

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
