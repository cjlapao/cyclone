[package]
name = "cyclone_engine"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Cyclone engine layer: states, camera rig, input, settings, rng, facade (spec 00)."

[features]
# Real device gamepads: adds bevy_gilrs (the only 0.20 producer of
# GamepadButtonStateChangedEvent). Linux build needs pkg-config +
# libudev headers for libudev-sys. The action-mapping path itself is
# always compiled and event-tested (input.rs mirror).
gamepad = ["bevy/bevy_gilrs"]

[dependencies]
bevy = { workspace = true }
cyclone_worldgen = { workspace = true }
serde = { workspace = true }
ron = { workspace = true }
directories = { workspace = true }

[dev-dependencies]
cyclone_render = { path = "../cyclone_render" }
