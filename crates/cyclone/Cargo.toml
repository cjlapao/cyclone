[package]
name = "cyclone"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Cyclone Rescue — the binary. Wires plugins together, nothing else (spec 00)."

[features]
default = []
# Physical gamepad support (bevy_gilrs). Linux build deps: pkg-config +
# libudev-dev (libudev-sys). Input MAPPING is compiled always and
# event-tested without the feature; this flag adds device I/O only.
gamepad = ["cyclone_engine/gamepad"]
# Fast local iteration: Bevy as a dylib + asset hot reload + dev tools.
# Never ship with it on (spec 00).
# NOTE: bevy_dev_tools deliberately NOT included — in Bevy 0.20 it
# pulls bevy_audio (rodio→cpal→alsa), which needs alsa system headers
# we do not otherwise depend on, and no code uses its APIs (F3 overlay
# is ours). Re-add only together with the alsa dev package.
dev = [
  "bevy/dynamic_linking",
  "bevy/file_watcher",
  "cyclone_game/dev",
]

[dependencies]
bevy = { workspace = true }
cyclone_engine = { workspace = true }
cyclone_render = { workspace = true }
cyclone_worldgen = { workspace = true }
cyclone_ui = { workspace = true }
cyclone_game = { workspace = true }
