name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt / clippy / test / build
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux system libs (macroquad)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libx11-dev libxi-dev libgl1-mesa-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: cargo build --release

  release:
    name: Release binaries
    needs: check
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: cyclone-rescue-linux-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: cyclone-rescue-windows-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: cyclone-rescue-macos-arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: cyclone-rescue-macos-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux system libs (macroquad)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libx11-dev libxi-dev libgl1-mesa-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --target ${{ matrix.target }}
      - name: Zip binary (unix)
        if: runner.os != 'Windows'
        run: |
          cp target/${{ matrix.target }}/release/cyclone-rescue ./cyclone-rescue
          zip ${{ matrix.artifact }}.zip cyclone-rescue
      - name: Zip binary (windows)
        if: runner.os == 'Windows'
        run: Compress-Archive target/${{ matrix.target }}/release/cyclone-rescue.exe ${{ matrix.artifact }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.zip

  macos-universal:
    name: macOS universal binary
    needs: release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: cyclone-rescue-macos-*
          merge-multiple: true
      - name: lipo merge
        run: |
          unzip cyclone-rescue-macos-arm64.zip -d arm
          unzip cyclone-rescue-macos-x86_64.zip -d x86
          lipo -create arm/cyclone-rescue x86/cyclone-rescue -output cyclone-rescue
          zip cyclone-rescue-macos-universal.zip cyclone-rescue
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            cyclone-rescue-macos-universal.zip
      - name: Pass-through other artifacts
        run: echo "linux/windows zips attached from their jobs via upload-artifact"
