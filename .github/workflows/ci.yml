name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt / clippy / test / build
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux system libs (winit/x11 + wgpu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxi-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libasound2-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo run -p worldgen-cli -- golden
      - name: Dependency direction (spec 00 C2/C3)
        shell: bash
        run: |
          # The generator must stay Bevy-free (C3). Dev-dependencies
          # are allowed (test-only); C2 is about what must COMPILE.
          if cargo tree -p cyclone_worldgen -e normal,dev | grep -q bevy; then
            echo "cyclone_worldgen depends on bevy"; exit 1
          fi
          # The engine must not reference any game crate on any NORMAL
          # edge (C2: deleting them still compiles the engine). `cargo
          # tree -i` exits 0 even when nothing matches, so grep for the
          # actual dependent instead of trusting the status code.
          for c in cyclone_game cyclone_render cyclone_ui cyclone worldgen-cli; do
            if cargo tree -p cyclone_engine -e normal -i "$c" 2>/dev/null |
                grep -q "cyclone_engine v"; then
              echo "cyclone_engine depends on game crate $c"; exit 1
            fi
          done

  # Benchmarks are informational; never gate the pipeline on them (spec 02 C4).
  bench:
    name: worldgen benchmark (log only)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo bench -p cyclone_worldgen

  release:
    name: Release binaries
    needs: check
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: cyclone-linux-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: cyclone-windows-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux system libs
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxi-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libasound2-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p cyclone --target ${{ matrix.target }}
      - name: Zip binary + assets (unix)
        if: runner.os != 'Windows'
        run: |
          cp target/${{ matrix.target }}/release/cyclone ./cyclone
          zip -r ${{ matrix.artifact }}.zip cyclone assets/
      - name: Zip binary + assets (windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path target/${{ matrix.target }}/release/cyclone.exe,assets -DestinationPath ${{ matrix.artifact }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.zip
