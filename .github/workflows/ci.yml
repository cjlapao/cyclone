name: ci

permissions:
  contents: write

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt / clippy / test / build
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux system libs (winit/x11 + wgpu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxi-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libasound2-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # MSVC codegen for the test profile happens HERE, not inside
      # the test step — so the test step's wall time means tests, and
      # a codegen failure names itself as a build failure.
      - name: build test binaries
        run: cargo build --workspace --all-targets
      # Logs are not anonymously downloadable; cargo's output goes to a
      # file (kill-proof) and failures carry themselves out as ::error::
      # annotations readable via the public annotations API.
      - name: cargo test --workspace
        shell: bash
        run: |
          set -o pipefail
          # Redirect, never pipe-tee: tee block-buffers, so a SIGKILL
          # mid-cargo loses the ENTIRE log (macOS silent deaths annotated
          # zero lines twice). Direct file writes survive any kill.
          RUST_TEST_THREADS=2 cargo test --workspace --jobs 2 > test.log 2>&1
          rc=$?
          if [ $rc -ne 0 ]; then
            { grep -aE "FAILED|panicked|error\[|test result: FAILED|golden drift" test.log | tail -n 6
              tail -n 8 test.log; } | sed 's/^/::error::/' | head -n 14
            exit $rc
          fi
      - name: annotate failure (fresh process)
        # If a test step is killed hard, ITS OWN annotation lines die with
        # it — this separate if:failure() step runs a new bash and reads
        # whatever test.log survived. Zero annotations from THIS step
        # would mean the runner itself is being eaten.
        if: failure()
        shell: bash
        run: |
          echo "::error::── from independent annotator step ──"
          ls -la test.log 2>/dev/null | sed 's/^/::error::stat /'
          tail -n 14 test.log 2>/dev/null | sed 's/^/::error::/' || echo "::error::test.log missing entirely"
      - name: gamepad feature build (Linux needs pkg-config + libudev-dev)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libudev-dev
          cargo check -p cyclone --features gamepad
      - name: dev-feature bin check (handoff command builds)
        shell: bash
        run: cargo check -p cyclone --features dev
      - name: dev-feature tests (F3 crate reveal)
        shell: bash
        run: |
          RUST_TEST_THREADS=2 cargo test -p cyclone_game --features dev --test flow --jobs 2 > devtest.log 2>&1
          rc=$?
          if [ $rc -ne 0 ]; then
            { grep -aE "FAILED|panicked|error\[" devtest.log | tail -n 6
              tail -n 6 devtest.log; } | sed 's/^/::error::/' | head -n 12
            exit $rc
          fi
      - name: upload failure evidence to ci-diagnostics branch
        if: failure()
        continue-on-error: true
        env:
          RUN_OS: ${{ runner.os }}
        run: |
          set -x
          mkdir -p ev && mv test.log devtest.log ev/ 2>/dev/null || true
          (df -h .; (vm_stat || free -m) 2>/dev/null | head -n 6) > ev/runner-state.txt 2>&1
          echo "$RUN_OS ${{ github.sha }}" > ev/which.txt
          git config user.name "ci-evidence"
          git config user.email "ci@localhost"
          git checkout --orphan ci-diagnostics
          git rm -rqf . 2>/dev/null || true
          cp -r ev/* . && rm -rf ev
          git add -A && git commit -m "failure evidence ${{ github.sha }} ($RUN_OS)"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}" ci-diagnostics
        timeout-minutes: 2
      - name: annotate dev-test failure (runner state included)
        if: failure()
        shell: bash
        run: |
          echo "::error::── annotator after dev-test ──"
          ls -la devtest.log 2>/dev/null | sed 's/^/::error::stat: /'
          echo "::error::log size: $(wc -c < devtest.log 2>/dev/null || echo NOFILE)"
          tail -n 10 devtest.log 2>/dev/null | sed 's/^/::error::/'
          df -h . | tail -n 1 | sed 's/^/::error::disk: /'
          (vm_stat || free -m) 2>/dev/null | head -n 4 | tr '\\n' ' ' | sed 's/^/::error::mem: /'
      - run: cargo run -p worldgen-cli -- golden
      - name: Dependency direction (spec 00 C2/C3)
        shell: bash
        run: |
          # The generator must stay Bevy-free (C3). Dev-dependencies
          # are allowed (test-only); C2 is about what must COMPILE.
          if cargo tree -p cyclone_worldgen -e normal,dev | grep -q bevy; then
            echo "cyclone_worldgen depends on bevy"; exit 1
          fi
          # The engine must not reference any game crate on any NORMAL
          # edge (C2: deleting them still compiles the engine). Detect
          # FORWARD on the engine's own tree — `-p A -i B` prints
          # nothing even when B does depend on A (learned the hard
          # way: the previous inverse form was vacuous).
          if cargo tree -p cyclone_engine -e normal |
              grep -qE "cyclone_game v|cyclone_render v|cyclone_ui v|cyclone v|worldgen-cli v"; then
            echo "cyclone_engine tree contains a game crate"; exit 1
          fi
          # Positive controls: the greps above must FIRE on real
          # edges, or a silent-pass detector is worthless.
          cargo tree -p cyclone_worldgen -e normal | grep -q "^cyclone_worldgen v" || {
            echo "control: worldgen tree empty"; exit 1; }
          cargo tree -p cyclone_game -e normal | grep -q "cyclone_engine v" || {
            echo "control: detector blind to a real dependency"; exit 1; }

  # Benchmarks are informational; never gate the pipeline on them (spec 02 C4).
  bench:
    name: worldgen benchmark (log only)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo bench -p cyclone_worldgen

  release:
    name: Release binaries
    needs: check
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: cyclone-linux-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: cyclone-windows-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux system libs
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxi-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libasound2-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p cyclone --target ${{ matrix.target }}
      - name: Zip binary + assets (unix)
        if: runner.os != 'Windows'
        run: |
          cp target/${{ matrix.target }}/release/cyclone ./cyclone
          zip -r ${{ matrix.artifact }}.zip cyclone assets/
      - name: Zip binary + assets (windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path target/${{ matrix.target }}/release/cyclone.exe,assets -DestinationPath ${{ matrix.artifact }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.zip
